<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0284c7">
  <meta name="description" content="Meeno: Smart Multilingual Protection & Guidance for AI Web Agents">
  <title>Meeno | Smart Shield for AI Web Agents</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 64 64'%3E%3Cpolygon points='32,2 40,24 62,32 40,40 32,62 24,40 2,32 24,24' fill='%230f172a'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23f0f9ff'/%3E%3Cpath d='M22 33 L29 40 L45 22' stroke='%2310b981' stroke-width='6.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="agent-network" href="./agent.network.json">
  <link rel="agent-mcp" href="./agent-mcp.json">
  <style>
    :root {
      --bg-grad: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f5f3ff 100%);
      --card: rgba(255, 255, 255, 0.96);
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --safe: #10b981;
      --safe-bg: #ecfdf5;
      --danger: #f43f5e;
      --danger-bg: #fff1f2;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      font-size: 18px;
      line-height: 1.65;
      background: var(--bg-grad);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }
    .topbar {
      width: 100%;
      max-width: 780px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.5rem;
      color: var(--text);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    select.lang-btn, .pill-btn {
      background: white;
      border: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      cursor: pointer;
      transition: 0.2s;
    }
    .pill-btn:hover { background: #f8fafc; }
    .pill-btn.active { background: #e0f2fe; border-color: var(--primary); color: var(--primary); }
    .main-card {
      width: 100%;
      max-width: 780px;
      background: var(--card);
      border: 1px solid white;
      border-radius: 28px;
      padding: 36px 28px;
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.06);
      text-align: center;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      padding: 10px 24px;
      background: #f8fafc;
      border-radius: 999px;
      border: 1px solid #e2e8f0;
    }
    h1 {
      margin: 0 0 12px 0;
      font-size: 1.85rem;
      font-weight: 800;
      line-height: 1.3;
    }
    .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 560px;
      margin: 0 auto 28px auto;
    }
    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    @media (max-width: 680px) {
      .action-grid { grid-template-columns: 1fr; }
      .main-card { padding: 26px 18px; }
    }
    .action-btn {
      border: 2px solid transparent;
      border-radius: 18px;
      padding: 16px 12px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.06);
    }
    .btn-good { background: var(--safe-bg); color: #065f46; border-color: #a7f3d0; }
    .btn-bad { background: var(--danger-bg); color: #9f1239; border-color: #fecdd3; }
    .btn-multi { background: #fef3c7; color: #92400e; border-color: #fde68a; }
    .search-bar {
      display: flex;
      gap: 8px;
      background: #f8fafc;
      padding: 8px;
      border-radius: 18px;
      border: 1px solid var(--border);
      margin-bottom: 22px;
    }
    .search-bar input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 14px;
      font-size: 1rem;
      color: var(--text);
      outline: none;
    }
    .search-bar button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .search-bar button:hover { background: var(--primary-hover); }
    .result-card {
      border-radius: 18px;
      padding: 18px 20px;
      text-align: start;
      display: none;
      margin-bottom: 16px;
    }
    .result-card.safe {
      display: block;
      background: var(--safe-bg);
      border: 1px solid #6ee7b7;
      color: #065f46;
    }
    .result-card.danger {
      display: block;
      background: var(--danger-bg);
      border: 1px solid #fda4af;
      color: #9f1239;
    }
    .token-pill {
      display: inline-block;
      margin-top: 8px;
      background: rgba(255,255,255,0.9);
      padding: 4px 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .stats-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 24px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e2e8f0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    details { margin-top: 16px; font-size: 0.9rem; color: var(--muted); }
    summary { cursor: pointer; font-weight: 600; color: var(--primary); list-style: none; }
    .dev-box {
      margin-top: 10px;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 0.85rem;
      direction: ltr;
      text-align: left;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 64 64" fill="none" xmlns="http://w3.org">
        <polygon points="32,2 40,24 62,32 40,40 32,62 24,40 2,32 24,24" fill="#0f172a"/>
        <circle cx="32" cy="32" r="14" fill="#f0f9ff"/>
        <path d="M22 33 L29 40 L45 22" stroke="#10b981" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Meeno</span>
    </div>
    <div class="controls">
      <button class="pill-btn" id="music-btn" onclick="toggleCalmMusic()">🔇 Calm Audio</button>
      <button class="pill-btn" id="install-btn" style="display:none; background:#0284c7; color:white; border:none;" onclick="installApp()">📲 Install App</button>
      <select class="lang-btn" onchange="setLang(this.value)" aria-label="Select Language">
        <option value="en">🌐 English</option>
        <option value="ar">🇯🇴 العربية</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="pt">🇧🇷 Português</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="hi">🇮🇳 हिन्दी</option>
        <option value="tr">🇹🇷 Türkçe</option>
      </select>
    </div>
  </div>

  <main class="main-card">
    <div class="logo-badge">
      <svg width="42" height="42" viewBox="0 0 64 64" fill="none" xmlns="http://w3.org">
        <polygon points="32,2 40,24 62,32 40,40 32,62 24,40 2,32 24,24" fill="#0f172a"/>
        <circle cx="32" cy="32" r="14" fill="#e0f2fe"/>
        <path d="M22 33 L29 40 L45 22" stroke="#10b981" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span style="font-size:1.7rem; font-weight:800; color:#0f172a;">Meeno</span>
    </div>

    <h1 data-i18n="heading">Smart Protection for AI Web Agents</h1>
    <p class="subtitle" data-i18n="subheading">Verify website integrity and safeguard AI agents from hidden prompt injections in real time—in every language.</p>

    <div class="action-grid">
      <button class="action-btn btn-good" onclick="testSafe()">
        <span style="font-size:1.5rem;">✈️</span>
        <span data-i18n="btnGood">Test Safe Website</span>
      </button>
      <button class="action-btn btn-bad" onclick="testAttack()">
        <span style="font-size:1.5rem;">🕵️</span>
        <span data-i18n="btnBad">Test Hidden Trap</span>
      </button>
      <button class="action-btn btn-multi" onclick="testMultiLang()">
        <span style="font-size:1.5rem;">🌍</span>
        <span data-i18n="btnMulti">Test Multilingual Trap</span>
      </button>
    </div>

    <div class="search-bar">
      <input type="text" id="user-text" placeholder="Or type any message in any language..." onkeydown="if(event.key==='Enter') testCustom()">
      <button onclick="testCustom()" data-i18n="btnCheck">Check Now</button>
    </div>

    <div class="result-card" id="result-box">
      <div style="font-weight:800; font-size:1.1rem; margin-bottom:4px;" id="result-title"></div>
      <div id="result-desc"></div>
      <div class="token-pill" id="result-token"></div>
    </div>

    <div class="stats-row">
      <div><strong id="stat-scans">0</strong> <span data-i18n="statScans">Checks</span></div>
