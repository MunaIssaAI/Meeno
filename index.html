<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeno - Smart Protection for AI Web Agents</title>
  <style>
    body { font-family: sans-serif; background: #eef6ff; margin: 0; padding: 20px; color: #1e293b; text-align: center; }
    .topbar { display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto 20px; }
    .brand { font-weight: bold; font-size: 20px; display: flex; align-items: center; gap: 8px; }
    .controls button, .controls select { background: #fff; border: 1px solid #cbd5e1; border-radius: 20px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
    .card { background: #fff; max-width: 550px; margin: 0 auto; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .badge { display: inline-flex; align-items: center; gap: 8px; background: #f1f5f9; padding: 8px 18px; border-radius: 20px; font-weight: bold; margin-bottom: 15px; }
    h1 { font-size: 24px; margin: 10px 0; }
    p.sub { color: #64748b; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    .btn { display: block; width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; border: 1px solid; }
    .btn-safe { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .btn-trap { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .btn-multi { background: #fefce8; border-color: #fef08a; color: #854d0e; }
    .input-group { display: flex; gap: 8px; margin-top: 15px; }
    input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; }
    .btn-check { background: #0284c7; color: #fff; border: none; padding: 12px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    #result { margin-top: 18px; padding: 14px; border-radius: 12px; display: none; text-align: left; font-size: 14px; line-height: 1.5; }
    .res-safe { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .res-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .counter { margin-top: 18px; color: #64748b; font-size: 13px; border-top: 1px solid #f1f5f9; padding-top: 12px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 64 64" fill="none"><path d="M32 2L38 14L50 10L46 22L58 28L46 34L50 46L38 42L32 54L26 42L14 46L18 34L6 28L18 22L14 10L26 14L32 2Z" fill="#0f172a"/><circle cx="32" cy="28" r="14" fill="#fff"/><path d="M25 28.5L29.5 33L39 23.5" stroke="#10b981" stroke-width="4" stroke-linecap="round"/></svg>
      Meeno
    </div>
    <div class="controls">
      <button id="audioBtn" onclick="toggleAudio()">🔇 Calm Audio</button>
      <select id="langSelect" onchange="changeLang()">
        <option value="en">🌐 English</option>
        <option value="ar">🌐 العربية</option>
      </select>
    </div>
  </div>

  <div class="card" id="mainCard">
    <div class="badge">
      <svg width="22" height="22" viewBox="0 0 64 64" fill="none"><path d="M32 2L38 14L50 10L46 22L58 28L46 34L50 46L38 42L32 54L26 42L14 46L18 34L6 28L18 22L14 10L26 14L32 2Z" fill="#0f172a"/><circle cx="32" cy="28" r="14" fill="#fff"/><path d="M25 28.5L29.5 33L39 23.5" stroke="#10b981" stroke-width="4" stroke-linecap="round"/></svg>
      Meeno
    </div>
    <h1 id="title">Smart Protection for AI Web Agents</h1>
    <p class="sub" id="subtitle">Verify website integrity and safeguard AI agents from hidden prompt injections in real time—in every language.</p>

    <button class="btn btn-safe" id="btnSafe" onclick="runTest('safe')">✈️ Test Safe Website</button>
    <button class="btn btn-trap" id="btnTrap" onclick="runTest('trap')">🕵️ Test Hidden Trap</button>
    <button class="btn btn-multi" id="btnMulti" onclick="runTest('multi')">🌍 Test Multilingual Trap</button>

    <div class="input-group">
      <input type="text" id="customInput" placeholder="Or type any message in any language..." />
      <button class="btn-check" id="btnCheck" onclick="checkCustom()">Check Now</button>
    </div>

    <div id="result"></div>
    <div class="counter"><strong id="count">0</strong> <span id="checksLabel">Checks</span></div>
  </div>

  <script>
    let checks = 0, audioCtx = null, isPlaying = false, timer = null;
    const data = {
      en: { dir: "ltr", title: "Smart Protection for AI Web Agents", sub: "Verify website integrity and safeguard AI agents from hidden prompt injections in real time—in every language.", safe: "✈️ Test Safe Website", trap: "🕵️ Test Hidden Trap", multi: "🌍 Test Multilingual Trap", ph: "Or type any message in any language...", chk: "Check Now", lbl: "Checks",
        r1: "✅ <b>Safe Content Verified:</b> No hidden instructions detected. AI Agent is safe.",
        r2: "🚨 <b>Hidden Prompt Injection Blocked!</b> Malicious instruction prevented.",
        r3: "🚨 <b>Multilingual Threat Blocked!</b> Hidden foreign override command stopped." },
      ar: { dir: "rtl", title: "حماية ذكية لوكلاء الذكاء الاصطناعي على الويب", sub: "تحقق من سلامة المواقع واحمِ وكلاء الذكاء الاصطناعي من هجمات حقن الأوامر المخفية في الوقت الفعلي وبجميع اللغات.", safe: "✈️ اختبار موقع آمن", trap: "🕵️ اختبار فخ مخفي", multi: "🌍 اختبار فخ متعدد اللغات", ph: "أو اكتب أي رسالة بأي لغة للفحص...", chk: "افحص الآن", lbl: "عمليات فحص",
        r1: "✅ <b>تم التحقق - محتوى آمن:</b> لا توجد تعليمات مخفية. الوكيل الذكي آمن.",
        r2: "🚨 <b>تم حظر حقن أوامر مخفي!</b> تم إيقاف التعليمات الخبيثة بنجاح.",
        r3: "🚨 <b>تم حظر تهديد متعدد اللغات!</b> تم إيقاف أمر الاختراق المخفي." }
    };

    function show(html, danger) {
      const r = document.getElementById("result");
      r.style.display = "block";
      r.className = danger ? "res-danger" : "res-safe";
      r.style.textAlign = document.getElementById("langSelect").value === "ar" ? "right" : "left";
      r.innerHTML = html;
      checks++;
      document.getElementById("count").innerText = checks;
    }

    function runTest(t) {
      const l = document.getElementById("langSelect").value;
      if (t === "safe") show(data[l].r1, false);
      if (t === "trap") show(data[l].r2, true);
      if (t === "multi") show(data[l].r3, true);
    }

    function checkCustom() {
      const v = document.getElementById("customInput").value.trim().toLowerCase();
      if (!v) return;
      const l = document.getElementById("langSelect").value;
      const bad = v.includes("ignore") || v.includes("hack") || v.includes("تجاهل") || v.includes("اختراق");
      show(bad ? data[l].r2 : data[l].r1, bad);
    }

    function changeLang() {
      const l = document.getElementById("langSelect").value;
      const t = data[l];
      document.getElementById("mainCard").dir = t.dir;
      document.getElementById("title").innerText = t.title;
      document.getElementById("subtitle").innerText = t.sub;
      document.getElementById("btnSafe").innerText = t.safe;
      document.getElementById("btnTrap").innerText = t.trap;
      document.getElementById("btnMulti").innerText = t.multi;
      document.getElementById("customInput").placeholder = t.ph;
      document.getElementById("btnCheck").innerText = t.chk;
      document.getElementById("checksLabel").innerText = t.lbl;
    }

    function tone(f) {
      if (!audioCtx || !isPlaying) return;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.01, audioCtx.currentTime);
      g.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 1.5);
    }

    function toggleAudio() {
      const b = document.getElementById("audioBtn");
      if (!isPlaying) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume(); isPlaying = true; b.innerText = "🔊 Calm Audio";
        let i = 0; tone(261.6);
        timer = setInterval(() => {
          i = (i + 1) % 4;
          tone(i === 0 ? 261.6 : i === 1 ? 329.6 : i === 2 ? 392.0 : 329.6);
        }, 900);
      } else {
        isPlaying = false; clearInterval(timer); audioCtx.close(); b.innerText = "🔇 Calm Audio";
      }
    }
  </script>
</body>
</html>
